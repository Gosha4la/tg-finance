<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Мои финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f0f2f6;--card:#fff;--text:#141c26;--hint:#8b93a5;--accent:#2aabee;--accent2:#6f5bff;
--green:#22a45d;--red:#e5484d;--chip:#f1f3f7;--border:rgba(20,28,38,.08);--shadow:0 8px 24px rgba(20,28,38,.08)}
body{--bg:#f0f2f6;--card:#fff;--text:#141c26;--hint:#8b93a5;--chip:#f1f3f7;--border:rgba(20,28,38,.08);
--shadow:0 8px 24px rgba(20,28,38,.08);color-scheme:light}
body.dark{--bg:#0b111c;--card:#151d2b;--text:#edf1f7;--hint:#8b96a8;--chip:#1f2937;
--border:rgba(255,255,255,.07);--shadow:0 6px 20px rgba(0,0,0,.4);color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:640px;margin:0 auto}
.month-nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px 6px}
.month-nav button{width:36px;height:36px;border-radius:12px;border:none;background:var(--card);
box-shadow:var(--shadow);color:var(--text);font-size:18px;cursor:pointer}
#monthTitle{font-size:17px;font-weight:700;min-width:160px;text-align:center}
.summary{margin:10px 16px 12px;padding:20px;border-radius:22px;color:#fff;
background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 30px rgba(64,110,238,.35)}
.summary .hint{font-size:13px;opacity:.85}
#balance{display:block;font-size:34px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.sum-row{display:flex;gap:10px;margin-top:16px}
.sum{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:10px 12px}
.sum span{font-size:12px;opacity:.85;display:block}
.sum strong{font-size:16px}
#catsCard{margin:0 16px 12px;padding:16px;background:var(--card);border-radius:20px;box-shadow:var(--shadow)}
.cats-title{font-size:13px;font-weight:600;color:var(--hint);margin-bottom:12px}
.bar-row{margin-bottom:10px}.bar-row:last-child{margin-bottom:0}
.bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ff8a65,var(--red))}
#list{margin:0 16px 110px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.tx:last-child{border-bottom:none}
.tx-icon{width:42px;height:42px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.tx-body{flex:1;min-width:0}
.tx-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12.5px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amount{font-size:15px;font-weight:700;flex:none}
.pos{color:var(--green)}.neg{color:var(--red)}
.tx-del{border:none;background:none;color:var(--hint);opacity:.45;font-size:13px;padding:6px;cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:var(--hint);font-size:14px;line-height:1.5}
.empty-ico{font-size:40px;margin-bottom:10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;
border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;
box-shadow:0 10px 26px rgba(64,110,238,.45);z-index:20;cursor:pointer}
.fab:active{transform:scale(.95)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:26px 26px 0 0;
padding:14px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);
transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:31;max-height:88vh;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--chip);margin:0 auto 12px}
.sheet h2{font-size:18px;text-align:center}
.segmented{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:14px 0}
.segmented button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-size:14px;font-weight:600;color:var(--hint);cursor:pointer}
.segmented button.active[data-type="expense"]{background:var(--card);color:var(--red);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.segmented button.active[data-type="income"]{background:var(--card);color:var(--green);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sheet input{width:100%;border:none;background:var(--chip);border-radius:14px;padding:14px;font-size:16px;color:var(--text);margin-bottom:12px;outline:none}
.sheet input:focus{box-shadow:0 0 0 2px var(--accent)}
#amount{font-size:22px;font-weight:700}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:none;background:var(--chip);color:var(--text);padding:9px 12px;border-radius:12px;font-size:13.5px;cursor:pointer}
.chip.sel{background:rgba(42,171,238,.15);box-shadow:inset 0 0 0 1.5px var(--accent);color:var(--accent)}
.save{width:100%;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:700;color:#fff;
background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer}
.save:active{transform:scale(.98)}
</style>
</head>
<body>
<div class="wrap">
  <div class="month-nav">
    <button id="prevM">‹</button><div id="monthTitle"></div><button id="nextM">›</button>
  </div>
  <div class="summary">
    <span class="hint">Баланс за месяц</span>
    <strong id="balance">0 ₽</strong>
    <div class="sum-row">
      <div class="sum"><span>Доходы</span><strong id="incSum"></strong></div>
      <div class="sum"><span>Расходы</span><strong id="expSum"></strong></div>
    </div>
  </div>
  <div id="catsCard"><div class="cats-title">Структура расходов</div><div id="catsBody"></div></div>
  <div id="list"></div>
</div>
<button class="fab" id="addBtn">+</button>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div><h2>Новая запись</h2>
  <div class="segmented">
    <button data-type="expense" class="active">Расход</button>
    <button data-type="income">Доход</button>
  </div>
  <input id="amount" type="number" inputmode="decimal" placeholder="Сумма, ₽">
  <div class="chips" id="chips"></div>
  <input id="comment" placeholder="Комментарий (необязательно)">
  <input id="date" type="date">
  <button class="save" id="save">Сохранить</button>
</div>
<script>
const $=s=>document.querySelector(s);
const tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand();}catch(e){}
const applyTheme=()=>document.body.classList.toggle('dark',tg?.colorScheme==='dark');
applyTheme(); try{tg?.onEvent('themeChanged',applyTheme);}catch(e){}

const CATS={
 expense:[['🏠','Жильё'],['🛒','Продукты'],['🍔','Еда вне дома'],['🚌','Проезд'],['📱','Связь'],['👕','Одежда'],['💊','Здоровье'],['🎉','Развлечения'],['🏋️','Спорт'],['📦','Прочее']],
 income:[['💼','Зарплата'],['🧾','Фриланс'],['🎁','Подарки'],['📈','Инвестиции'],['💰','Прочее']]
};
const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let txs=JSON.parse(localStorage.getItem('fin_txs')||'[]');
let view=new Date(), formType='expense', formCat=null;
const save=()=>localStorage.setItem('fin_txs',JSON.stringify(txs));
const fmt=n=>n.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const mKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const icon=(t,n)=>(CATS[t].find(c=>c[1]===n)||['💸'])[0];

function render(){
  const key=mKey(view);
  $('#monthTitle').textContent=MN[view.getMonth()]+' '+view.getFullYear();
  const list=txs.filter(t=>t.date.startsWith(key));
  const inc=list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const exp=list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  $('#incSum').textContent='+'+fmt(inc);
  $('#expSum').textContent='−'+fmt(exp);
  const bal=inc-exp;
  $('#balance').textContent=(bal<0?'−':'')+fmt(Math.abs(bal));
  // структура расходов
  const by={}; list.filter(t=>t.type==='expense').forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('#catsCard').style.display=top.length?'':'none';
  $('#catsBody').innerHTML=top.map(([n,s])=>`<div class="bar-row">
    <div class="bar-head"><span>${icon('expense',n)} ${n}</span><span>${fmt(s)}</span></div>
    <div class="bar"><div class="bar-fill" style="width:${Math.round(s/exp*100)}%"></div></div></div>`).join('');
  // список
  const sorted=[...list].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('#list').innerHTML=sorted.length?sorted.map(t=>{
    const[,m,d]=t.date.split('-').map(Number);
    return `<div class="tx"><div class="tx-icon">${icon(t.type,t.cat)}</div>
      <div class="tx-body"><div class="tx-title">${esc(t.cat)}</div>
      <div class="tx-sub">${d} ${MG[m-1]}${t.comment?' · '+esc(t.comment):''}</div></div>
      <div class="tx-amount ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}</div>
      <button class="tx-del" data-id="${t.id}">✕</button></div>`;
  }).join(''):`<div class="empty"><div class="empty-ico">🗒️</div>Пока нет записей за этот месяц.<br>Нажмите «+», чтобы добавить.</div>`;
}
$('#prevM').onclick=()=>{view.setMonth(view.getMonth()-1);render();};
$('#nextM').onclick=()=>{view.setMonth(view.getMonth()+1);render();};
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('.tx-del'); if(!b)return;
  const id=+b.dataset.id;
  const del=()=>{txs=txs.filter(t=>t.id!==id);save();render();tg?.HapticFeedback?.impactOccurred('light');};
  if(tg?.showConfirm)tg.showConfirm('Удалить эту запись?',ok=>ok&&del());
  else if(confirm('Удалить эту запись?'))del();
});
// форма
const sheet=$('#sheet'),overlay=$('#overlay');
const buildChips=()=>$('#chips').innerHTML=CATS[formType].map(([i,n])=>
  `<button class="chip${formCat===n?' sel':''}" data-cat="${n}">${i} ${n}</button>`).join('');
const segUpdate=()=>document.querySelectorAll('.segmented button').forEach(b=>
  b.classList.toggle('active',b.dataset.type===formType));
document.querySelectorAll('.segmented button').forEach(b=>b.onclick=()=>{formType=b.dataset.type;formCat=null;segUpdate();buildChips();});
$('#chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;formCat=c.dataset.cat;buildChips();tg?.HapticFeedback?.impactOccurred('light');});
const openSheet=()=>{formType='expense';formCat=null;segUpdate();buildChips();
  $('#amount').value='';$('#comment').value='';$('#date').value=todayStr();
  sheet.classList.add('open');overlay.classList.add('show');setTimeout(()=>$('#amount').focus(),250);};
const closeSheet=()=>{sheet.classList.remove('open');overlay.classList.remove('show');};
$('#addBtn').onclick=openSheet; overlay.onclick=closeSheet;
$('#save').onclick=()=>{
  const amount=parseFloat(($('#amount').value||'').replace(',','.'));
  const date=$('#date').value||todayStr();
  const warn=m=>tg?.showAlert?tg.showAlert(m):alert(m);
  if(!amount||amount<=0)return warn('Введите сумму больше нуля');
  if(!formCat)return warn('Выберите категорию');
  txs.push({id:Date.now(),type:formType,amount,cat:formCat,comment:$('#comment').value.trim(),date});
  save(); const[y,m]=date.split('-').map(Number); view=new Date(y,m-1,1);
  render(); closeSheet(); tg?.HapticFeedback?.notificationOccurred('success');
};
render();
</script>
</body>
</html>
